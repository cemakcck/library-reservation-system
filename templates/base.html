<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Library Reservations{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #74ebd5, #9face6); font-family: Arial, sans-serif; color: #333; min-height: 100vh; }
        .container { margin-top: 50px; background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .btn-primary { background-color: #5a54d4; border: none; }
        .btn-primary:hover { background-color: #4841b8; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; }
        .card-header { background-color: #5a54d4; color: white; font-weight: bold; }
        .list-group-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .form-container { padding: 20px; background: #f9f9f9; border-radius: 10px; }
        .form-label { font-weight: bold; }
        footer { margin: 40px 0 20px; text-align: center; color: #333; }
    </style>
</head>
<body>
    <main class="container">
        <div class="header">
            <h1>{% block heading %}{% endblock %}</h1>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>Library Reservations · CMPE331 course project</p>
    </footer>
</body>
</html>
